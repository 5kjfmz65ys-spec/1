name: Extract Company OS once

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  extract-company-os:
    if: github.event.head_commit.message == 'Trigger Company OS extraction'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Company OS upload branch
        uses: actions/checkout@v4
        with:
          ref: company-os
          fetch-depth: 0

      - name: Rebuild and extract archive
        shell: bash
        run: |
          set -euo pipefail

          test -d company-os-archive
          cat company-os-archive/part-* | tr -d '\r\n' > /tmp/company-os.zip.b64
          base64 --decode /tmp/company-os.zip.b64 > /tmp/company-os.zip
          unzip -q /tmp/company-os.zip -d /tmp/company-os-extracted

          test -f /tmp/company-os-extracted/company-os/package.json
          test -f /tmp/company-os-extracted/company-os/prisma/schema.prisma

          # Do not publish local environment secrets.
          rm -f /tmp/company-os-extracted/company-os/.env

          # Replace the branch with the extracted Company OS project.
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/company-os-extracted/company-os/. .

          mkdir -p .github/workflows
          cat > .github/workflows/company-os-ci.yml <<'YAML'
          name: Company OS CI

          on:
            push:
              branches:
                - company-os
            pull_request:
              branches:
                - main

          jobs:
            verify:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: 20
                    cache: npm
                - run: npm ci
                - run: npm run db:setup
                - run: npm run typecheck --if-present
                - run: npm test --if-present
                - run: npm run build
          YAML

      - name: Commit complete Company OS project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import complete Company OS project"
          git push origin HEAD:company-os
