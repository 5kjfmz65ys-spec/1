name: Extract Company OS

on:
  push:
    branches:
      - company-os
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    if: github.event.head_commit.message != 'Extract Company OS project'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout company-os branch
        uses: actions/checkout@v4
        with:
          ref: company-os
          fetch-depth: 0

      - name: Extract uploaded archive
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d company-os-archive ]; then
            echo "Archive already extracted."
            exit 0
          fi

          cat company-os-archive/part-* | tr -d '\r\n' > /tmp/company-os.zip.b64
          base64 --decode /tmp/company-os.zip.b64 > /tmp/company-os.zip
          unzip -q /tmp/company-os.zip -d /tmp/company-os-extracted

          test -f /tmp/company-os-extracted/company-os/package.json
          test -f /tmp/company-os-extracted/company-os/prisma/schema.prisma

          # Never commit local secrets.
          rm -f /tmp/company-os-extracted/company-os/.env

          # Replace the old branch contents while preserving Git metadata and workflows.
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/company-os-extracted/company-os/. .

      - name: Commit extracted project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Extract Company OS project"
          git push origin HEAD:company-os
