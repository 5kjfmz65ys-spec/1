name: Deploy Company OS Preview

on:
  push:
    branches:
      - deploy-company-os-preview
    paths:
      - "company-os-preview/**"
      - ".github/workflows/deploy-company-os-preview.yml"
  workflow_dispatch:

jobs:
  deploy:
