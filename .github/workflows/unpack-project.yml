name: Unpack Reddad AI project

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/unpack-project.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify project archive
        shell: bash
        run: |
          set -euo pipefail
          test -f reddad-ai-mvp.zip
          unzip -tq reddad-ai-mvp.zip

      - name: Extract project into repository root
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/reddad-ai-unpack
          mkdir -p /tmp/reddad-ai-unpack
          unzip -q reddad-ai-mvp.zip -d /tmp/reddad-ai-unpack
          test -d /tmp/reddad-ai-unpack/reddad-ai
          rsync -a --delete-excluded --exclude='.git/' /tmp/reddad-ai-unpack/reddad-ai/ ./
          rm -f reddad-ai-mvp.zip

      - name: Block secrets and generated data
        shell: bash
        run: |
          set -euo pipefail
          if find . -type f \( -name '.env' -o -name '*.pem' -o -name '*.key' \) -not -path './.git/*' | grep -q .; then
            echo 'Refusing to commit secret-looking files.' >&2
            find . -type f \( -name '.env' -o -name '*.pem' -o -name '*.key' \) -not -path './.git/*'
            exit 1
          fi
          if find . -type d \( -name node_modules -o -name sessions \) -not -path './.git/*' | grep -q .; then
            echo 'Refusing to commit generated dependency or session directories.' >&2
            exit 1
          fi
          test -f .env.example
          test -f package.json
          test -f README.md

      - name: Commit extracted project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Extract Reddad AI project files'
          git push origin HEAD:main
