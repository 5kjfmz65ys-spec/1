<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>غرفة القيادة</title>
<style>
:root{--bg:#090d12;--panel:#121820;--panel2:#18212b;--line:#26313d;--text:#eef2f6;--muted:#8d99a7;--gold:#e8a33d;--blue:#4fa3d1;--pink:#eb5fa0;--green:#4fd1a5;--indigo:#7c8cf8}
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:26px 14px 60px;background:var(--bg);background-image:linear-gradient(#151c24 1px,transparent 1px),linear-gradient(90deg,#151c24 1px,transparent 1px);background-size:34px 34px;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}.wrap{max-width:1000px;margin:auto}header{text-align:center;margin-bottom:24px}.tag{color:var(--gold);font-size:12px;font-weight:800;letter-spacing:1px}h1{font-size:clamp(30px,7vw,46px);margin:8px 0 6px}header p{color:var(--muted);margin:0}.console,.ceo,.dept{background:var(--panel);border:1px solid var(--line);border-radius:16px}.console{padding:16px;margin:28px 0}.label{font-size:13px;color:var(--muted);margin-bottom:8px}.label:before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--gold);margin-left:8px}textarea{width:100%;min-height:92px;resize:vertical;border:0;outline:0;background:transparent;color:var(--text);font:inherit;font-size:16px;line-height:1.7}textarea::placeholder{color:#5c6874}.actions{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:var(--panel2);color:var(--muted);padding:7px 11px;border-radius:999px;font-size:12px;cursor:pointer}.chip:active{transform:scale(.98)}button{border:0;border-radius:11px;background:var(--gold);color:#211408;font-weight:800;font-size:15px;padding:12px 24px;cursor:pointer}button:disabled{opacity:.55}.ceo{max-width:470px;margin:auto;padding:17px;border-color:var(--gold)}.row{display:flex;gap:11px;align-items:center}.icon{width:39px;height:39px;border-radius:11px;display:grid;place-items:center;background:#4a3a20;font-size:20px}.title{font-weight:900}.sub{font-size:12px;color:var(--muted);margin-top:3px}.status{margin-right:auto;border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--muted);font-size:11px}.status.done{color:var(--green);border-color:var(--green)}.note{color:var(--muted);font-size:13px;line-height:1.7;margin-top:10px;min-height:18px}.line{width:2px;height:25px;background:var(--line);margin:auto}.bar{height:2px;background:var(--line);max-width:780px;margin:auto}.litline{background:var(--gold);box-shadow:0 0 10px var(--gold)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:24px}.dept{padding:15px;min-height:145px;transition:.2s}.dept.active{border-color:var(--accent);box-shadow:0 0 0 1px color-mix(in srgb,var(--accent),transparent 65%)}.dept .icon{background:color-mix(in srgb,var(--accent),transparent 78%)}.brief{display:none;color:var(--muted);font-size:12px;line-height:1.6;margin-top:10px}.out{display:none;white-space:pre-wrap;border-top:1px dashed var(--line);padding-top:11px;margin-top:11px;font-size:13px;line-height:1.8}.dept.active .brief,.dept.show .out{display:block}.loader{display:none;width:15px;height:15px;border:2px solid #52606e;border-top-color:var(--accent);border-radius:50%;margin-right:auto;animation:spin .7s linear infinite}.dept.loading .loader{display:block}@keyframes spin{to{transform:rotate(360deg)}}footer{text-align:center;color:#596572;font-size:12px;margin-top:40px}.error{color:#ff8c78!important}@media(max-width:820px){.grid{grid-template-columns:1fr 1fr}.line,.bar{display:none}}@media(max-width:520px){.grid{grid-template-columns:1fr}.actions button{width:100%}}
</style>
</head>
<body>
<div class="wrap">
<header><div class="tag">شركة افتراضية · نسخة تعمل من المتصفح</div><h1>غرفة القيادة</h1><p>اكتب أمرك وسيتم توزيعه على الأقسام المناسبة.</p></header>
<section class="console"><div class="label">أمر جديد للفريق</div><textarea id="cmd" placeholder="مثال: سوّ لي خطة تسويق لمشروع مقهى بميزانية 20 ألف ريال"></textarea><div class="actions"><div class="chips"><span class="chip" data-v="سوّ دراسة جدوى مختصرة لمشروع مقهى تخصصي">دراسة جدوى</span><span class="chip" data-v="حلل السوق المستهدف لتطبيق توصيل بقالة">تحليل سوق</span><span class="chip" data-v="سوّ ميزانية تقديرية لمشروع بـ 50 ألف ريال">ميزانية مشروع</span></div><button id="go" type="button">نفّذ الأمر</button></div></section>
<section class="ceo" id="ceo"><div class="row"><div class="icon">★</div><div><div class="title">الإدارة العامة</div><div class="sub">توزيع الأوامر واتخاذ القرار</div></div><span class="status" id="status">بالانتظار</span></div><div class="note" id="note"></div></section><div class="line" id="line"></div><div class="bar" id="bar"></div>
<div class="grid" id="grid"></div><footer>هذه نسخة محلية تجريبية؛ تعمل بدون مفتاح API.</footer>
</div>
<script>
(function(){
const deps=[
{id:'analysis',name:'التحليل والأبحاث',icon:'▥',color:'var(--blue)'},
{id:'marketing',name:'التسويق',icon:'◖',color:'var(--pink)'},
{id:'finance',name:'المحاسبة والمالية',icon:'﷼',color:'var(--green)'},
{id:'ops',name:'الإدارة والعمليات',icon:'▦',color:'var(--indigo)'}];
const grid=document.getElementById('grid');
deps.forEach(d=>{const x=document.createElement('section');x.className='dept';x.id='d-'+d.id;x.style.setProperty('--accent',d.color);x.innerHTML='<div class="row"><div class="icon">'+d.icon+'</div><div class="title">'+d.name+'</div><span class="loader"></span></div><div class="brief" id="b-'+d.id+'"></div><div class="out" id="o-'+d.id+'"></div>';grid.appendChild(x)});
const cmd=document.getElementById('cmd'),go=document.getElementById('go'),status=document.getElementById('status'),note=document.getElementById('note');
function reset(){status.textContent='بالانتظار';status.className='status';note.textContent='';document.getElementById('line').className='line';document.getElementById('bar').className='bar';deps.forEach(d=>{const e=document.getElementById('d-'+d.id);e.className='dept';document.getElementById('b-'+d.id).textContent='';document.getElementById('o-'+d.id).textContent=''})}
function money(t){const a={'٠':'0','١':'1','٢':'2','٣':'3','٤':'4','٥':'5','٦':'6','٧':'7','٨':'8','٩':'9'};t=t.replace(/[٠-٩]/g,x=>a[x]).replace(/,/g,'');const m=t.match(/(\d+(?:\.\d+)?)\s*(ألف|الف|مليون)?/);if(!m)return 50000;let n=+m[1];if(m[2]&&/ألف|الف/.test(m[2]))n*=1000;if(m[2]==='مليون')n*=1000000;return n>=1000?n:50000}
function choose(t){t=t.toLowerCase();const s={analysis:0,marketing:0,finance:0,ops:0},add=(k,w)=>w.forEach(x=>{if(t.includes(x))s[k]+=2});add('analysis',['دراسة','جدوى','سوق','تحليل','بحث','منافس','عملاء','بيانات','مشروع']);add('marketing',['تسويق','اعلان','إعلان','حملة','محتوى','براند','هوية','سناب','تيك توك','مبيعات']);add('finance',['ميزانية','تكلفة','سعر','ربح','خسارة','ريال','رأس مال','راس مال','تسعير']);add('ops',['خطة','تشغيل','مهام','موظف','فريق','جدول','تنفيذ','مراحل','عمليات']);if(!Object.values(s).some(Boolean))s.ops=1;return Object.entries(s).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,3).map(x=>x[0])}
function brief(id,t){return {analysis:'حلّل السوق والطلب والمخاطر والفرص المتعلقة بـ: ',marketing:'أنشئ خطة تسويق ورسائل وقنوات مناسبة لـ: ',finance:'قدّم تقديرًا ماليًا وتوزيع ميزانية لـ: ',ops:'حوّل الطلب إلى خطوات تنفيذ وجدول مسؤوليات لـ: '}[id]+t}
function output(id,t){const b=money(t),f=n=>new Intl.NumberFormat('ar-SA').format(Math.round(n));if(id==='analysis')return 'تحليل أولي\n\n1) الهدف\nتحويل «'+t+'» إلى قرار قابل للتنفيذ قبل الصرف.\n\n2) اختبار السوق\n• تحدث مع 10 عملاء محتملين.\n• اعرض نسخة تجريبية وسعرًا واضحًا.\n• معيار النجاح: 3 عملاء جادين أو تحويل 5% فأكثر.\n\n3) المخاطر\n• المبالغة في حجم الطلب.\n• صرف الميزانية قبل الاختبار.\n• الاعتماد على مورد أو قناة واحدة.\n\n4) القرار\nابدأ صغيرًا، اجمع أرقامًا حقيقية، ثم توسع.';if(id==='marketing')return 'خطة تسويق\n\n1) الرسالة\nحل واضح وسريع لـ «'+t+'» بنتيجة قابلة للقياس.\n\n2) القنوات\n• تيك توك وسناب للمحتوى القصير.\n• واتساب للمتابعة وإغلاق البيع.\n• إعلان محلي عند وجود نطاق جغرافي.\n\n3) خطة 14 يومًا\n• 1–3: تجهيز العرض والهوية.\n• 4–7: نشر 6 مقاطع واختبار رسالتين.\n• 8–14: إعادة استهداف المهتمين.\n\n4) القياس\nالاستفسارات، تكلفة الاستفسار، التحويل، ومتوسط الطلب.';if(id==='finance')return 'تصور مالي مبدئي\n\nالميزانية: '+f(b)+' ريال\n\n• تأسيس وتجهيز: '+f(b*.45)+' ريال (45%)\n• تشغيل أولي: '+f(b*.25)+' ريال (25%)\n• تسويق: '+f(b*.15)+' ريال (15%)\n• احتياطي: '+f(b*.15)+' ريال (15%)\n\nنقطة التعادل = المصاريف الثابتة ÷ ربح الوحدة.\nلا تستخدم الاحتياطي في التأسيس، وراقب التدفق النقدي أسبوعيًا.';return 'خطة تنفيذ\n\nالمرحلة 1 — التحديد (يومان)\n• تحديد النتيجة والميزانية والموعد.\n\nالمرحلة 2 — الإعداد (3 أيام)\n• جمع المتطلبات والموردين.\n• إعداد قائمة مهام ومسؤول لكل مهمة.\n\nالمرحلة 3 — تجربة مصغرة (7 أيام)\n• تنفيذ نسخة محدودة.\n• تسجيل الوقت والتكلفة والمشكلات.\n\nالمرحلة 4 — المراجعة\n• قياس النتيجة.\n• تحسين أفضل خطوة ثم التوسع تدريجيًا.'}
async function run(){const t=cmd.value.trim();if(!t){cmd.focus();note.textContent='اكتب الأمر أولًا.';note.className='note error';return}reset();note.className='note';go.disabled=true;go.textContent='جاري التنفيذ...';status.textContent='يحلل';await new Promise(r=>setTimeout(r,350));const ids=choose(t),names=ids.map(id=>deps.find(d=>d.id===id).name);status.textContent='تم التوزيع';status.className='status done';note.textContent='تم توزيع المهمة على: '+names.join('، ');document.getElementById('line').className='line litline';document.getElementById('bar').className='bar litline';for(const id of ids){const e=document.getElementById('d-'+id);e.classList.add('active','loading');document.getElementById('b-'+id).textContent='المهمة: '+brief(id,t);await new Promise(r=>setTimeout(r,420));e.classList.remove('loading');e.classList.add('show');document.getElementById('o-'+id).textContent=output(id,t)}go.disabled=false;go.textContent='نفّذ الأمر';setTimeout(()=>document.getElementById('d-'+ids[0]).scrollIntoView({behavior:'smooth',block:'center'}),100)}
go.addEventListener('click',run);cmd.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey))run()});document.querySelectorAll('.chip').forEach(x=>x.addEventListener('click',()=>{cmd.value=x.dataset.v;cmd.focus()}));
})();
</script>
</body>
</html>
