<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تسجيل الدخول — ردّاد AI</title><link rel="stylesheet" href="/styles.css"></head>
<body><main class="auth-page"><aside class="auth-side"><a class="brand" href="/"><span class="brand-mark">ر</span><span>ردّاد AI</span></a><div><h1>كل محادثات عملائك في مكان واحد.</h1><p>اربط واتساب، أضف قاعدة المعرفة، وابدأ إدارة خدمة العملاء بواجهة عربية.</p></div><small>الربط التجريبي غير معتمد من Meta.</small></aside><section class="auth-main"><div class="auth-box"><h2>أهلًا بعودتك</h2><p class="muted">سجل دخولك للوصول إلى لوحة التحكم.</p><div id="formError" class="form-error hidden"></div><form id="loginForm"><div class="form-group"><label for="email">البريد الإلكتروني</label><input id="email" name="email" type="email" autocomplete="email" required></div><div class="form-group"><label for="password">كلمة المرور</label><input id="password" name="password" type="password" autocomplete="current-password" required></div><button class="btn btn-primary" style="width:100%" type="submit">تسجيل الدخول</button></form><p class="small muted" style="text-align:center;margin-top:18px">ليس لديك حساب؟ <a class="text-brand" href="/signup.html">إنشاء حساب</a></p></div></section></main><script src="/auth.js"></script></body></html>
