<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إنشاء حساب — ردّاد AI</title><link rel="stylesheet" href="/styles.css"></head>
<body><main class="auth-page"><aside class="auth-side"><a class="brand" href="/"><span class="brand-mark">ر</span><span>ردّاد AI</span></a><div><h1>أسس مركز خدمة العملاء خلال دقائق.</h1><p>حساب واحد، منشأة معزولة، وقاعدة معرفة خاصة بك.</p></div><small>مفاتيح واتساب والذكاء الاصطناعي تبقى على حسابك أنت.</small></aside><section class="auth-main"><div class="auth-box"><h2>إنشاء حساب جديد</h2><p class="muted">أنشئ منشأتك الأولى وابدأ الإعداد.</p><div id="formError" class="form-error hidden"></div><form id="signupForm"><div class="form-group"><label for="name">الاسم</label><input id="name" name="name" autocomplete="name" required></div><div class="form-group"><label for="organizationName">اسم المنشأة</label><input id="organizationName" name="organizationName" required></div><div class="form-group"><label for="email">البريد الإلكتروني</label><input id="email" name="email" type="email" autocomplete="email" required></div><div class="form-group"><label for="password">كلمة المرور</label><input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required></div><button class="btn btn-primary" style="width:100%" type="submit">إنشاء الحساب</button></form><p class="small muted" style="text-align:center;margin-top:18px">لديك حساب؟ <a class="text-brand" href="/login.html">تسجيل الدخول</a></p></div></section></main><script src="/auth.js"></script></body></html>
